name: Release Dev
# Intent: bump a version on development and push a tag. Packaging is handled by
# the Release workflow's tag trigger (BigWigs skips branch pushes when HEAD is
# already tagged).

on:
  push:
    branches: [development]

# Allow the workflow to push the version-bump commit/tag.
permissions:
  contents: write

concurrency:
  group: release-dev
  cancel-in-progress: false

jobs:
  bump:
    runs-on: ubuntu-latest
    # Skip the run triggered by our own bump commit to avoid an infinite loop.
    if: ${{ !contains(github.event.head_commit.message, '[release]') }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Bump patch version
        id: bump
        run: |
          set -euo pipefail
          current=$(grep -oP '^## Version:\s*\K[0-9]+\.[0-9]+\.[0-9]+' VendorMap.toc | head -1)
          if [ -z "$current" ]; then
            echo "Could not read current version from VendorMap.toc" >&2
            exit 1
          fi
          IFS='.' read -r major minor patch <<< "$current"
          next="${major}.${minor}.$((patch + 1))"
          echo "Bumping ${current} -> ${next}"

          # Core TOC + runtime constant
          sed -i "s/^## Version:.*/## Version: ${next}/" VendorMap.toc
          sed -i "s/ns\.VERSION = \"[0-9.]*\"/ns.VERSION = \"${next}\"/" Constants.lua

          # LoD data pack TOCs
          for f in packs/VendorMap_Data_*/*.toc; do
            sed -i "s/^## Version:.*/## Version: ${next}/" "$f"
          done

          # Seed generator's baked version
          sed -i "s/^ADDON_VERSION = \"[0-9.]*\"/ADDON_VERSION = \"${next}\"/" tools/extract_att_vendors.py

          echo "version=${next}" >> "$GITHUB_OUTPUT"
          echo "tag=v${next}" >> "$GITHUB_OUTPUT"

      - name: Commit and tag
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: release ${{ steps.bump.outputs.tag }} [release]"
          git tag -a "${{ steps.bump.outputs.tag }}" -m "${{ steps.bump.outputs.tag }}"
          git push origin HEAD:${{ github.ref_name }}
          git push origin "${{ steps.bump.outputs.tag }}"
