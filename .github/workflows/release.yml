name: Release

on:
  push:
    branches: [main]

# Allow the workflow to push the version-bump commit/tag and create releases.
permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    # Skip the run triggered by our own bump commit to avoid an infinite loop.
    if: ${{ !contains(github.event.head_commit.message, '[release]') }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Bump patch version
        id: bump
        run: |
          set -euo pipefail
          current=$(grep -oP '^## Version:\s*\K[0-9]+\.[0-9]+\.[0-9]+' VendorMap.toc | head -1)
          if [ -z "$current" ]; then
            echo "Could not read current version from VendorMap.toc" >&2
            exit 1
          fi
          IFS='.' read -r major minor patch <<< "$current"
          next="${major}.${minor}.$((patch + 1))"
          echo "Bumping ${current} -> ${next}"

          # Core TOC + runtime constant
          sed -i "s/^## Version:.*/## Version: ${next}/" VendorMap.toc
          sed -i "s/ns\.VERSION = \"[0-9.]*\"/ns.VERSION = \"${next}\"/" Constants.lua

          # LoD data pack TOCs
          for f in packs/VendorMap_Data_*/*.toc; do
            sed -i "s/^## Version:.*/## Version: ${next}/" "$f"
          done

          # Seed generator's baked version
          sed -i "s/^ADDON_VERSION = \"[0-9.]*\"/ADDON_VERSION = \"${next}\"/" tools/extract_att_vendors.py

          echo "version=${next}" >> "$GITHUB_OUTPUT"
          echo "tag=v${next}" >> "$GITHUB_OUTPUT"

      - name: Commit and tag
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: release ${{ steps.bump.outputs.tag }} [release]"
          git tag -a "${{ steps.bump.outputs.tag }}" -m "${{ steps.bump.outputs.tag }}"
          git push origin HEAD:${{ github.ref_name }}
          git push origin "${{ steps.bump.outputs.tag }}"

      # Reads the CurseForge project id from VendorMap.toc (## X-Curse-Project-ID)
      # and uploads when CF_API_KEY is set; always attaches the zip to a GitHub release.
      #
      # BigWigs skips branch pushes when HEAD is already tagged ("Found future tag,
      # not packaging") to avoid double-builds with tag workflows. We create the
      # release tag in this same job, so override GITHUB_REF to that tag.
      - name: Package and upload to CurseForge
        uses: BigWigsMods/packager@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CF_API_KEY: ${{ secrets.CF_API_KEY }}
          GITHUB_REF: refs/tags/${{ steps.bump.outputs.tag }}
          GITHUB_REF_NAME: ${{ steps.bump.outputs.tag }}
        with:
          args: -g retail
