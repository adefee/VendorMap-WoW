name: Release

on:
  push:
    branches: [main]
    tags:
      - 'v*.*.*'
  # Package an existing tag (e.g. after a failed/missed upload).
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to package (e.g. v0.6.4)'
        required: true
        type: string

# Allow the workflow to push the version-bump commit/tag and create releases.
permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Auto-bump on pushes to main, then push a version tag.
  # Packaging must run in this same workflow: pushes authenticated with
  # GITHUB_TOKEN do not trigger new workflow runs, so a separate
  # tag-triggered job would never fire after bump.
  bump:
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'push' && github.ref_type == 'branch' && !contains(github.event.head_commit.message, '[release]') }}
    outputs:
      tag: ${{ steps.bump.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Bump patch version
        id: bump
        run: |
          set -euo pipefail
          current=$(grep -oP '^## Version:\s*\K[0-9]+\.[0-9]+\.[0-9]+' VendorMap.toc | head -1)
          if [ -z "$current" ]; then
            echo "Could not read current version from VendorMap.toc" >&2
            exit 1
          fi
          IFS='.' read -r major minor patch <<< "$current"
          next="${major}.${minor}.$((patch + 1))"
          echo "Bumping ${current} -> ${next}"

          # Core TOC + runtime constant
          sed -i "s/^## Version:.*/## Version: ${next}/" VendorMap.toc
          sed -i "s/ns\.VERSION = \"[0-9.]*\"/ns.VERSION = \"${next}\"/" Constants.lua

          # LoD data pack TOCs
          for f in packs/VendorMap_Data_*/*.toc; do
            sed -i "s/^## Version:.*/## Version: ${next}/" "$f"
          done

          # Seed generator's baked version
          sed -i "s/^ADDON_VERSION = \"[0-9.]*\"/ADDON_VERSION = \"${next}\"/" tools/extract_att_vendors.py

          echo "version=${next}" >> "$GITHUB_OUTPUT"
          echo "tag=v${next}" >> "$GITHUB_OUTPUT"

      - name: Commit and tag
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: release ${{ steps.bump.outputs.tag }} [release]"
          git tag -a "${{ steps.bump.outputs.tag }}" -m "${{ steps.bump.outputs.tag }}"
          git push origin HEAD:${{ github.ref_name }}
          git push origin "${{ steps.bump.outputs.tag }}"

  # Runs after a successful bump, on tag pushes, or via workflow_dispatch.
  package:
    runs-on: ubuntu-latest
    needs: bump
    if: >-
      always()
      && !cancelled()
      && (
        github.event_name == 'workflow_dispatch'
        || (github.event_name == 'push' && github.ref_type == 'tag')
        || needs.bump.result == 'success'
      )
    steps:
      - name: Resolve release tag
        id: meta
        run: |
          set -euo pipefail
          tag="${{ needs.bump.outputs.tag || inputs.tag || github.ref_name }}"
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Refusing to package non-semver tag: ${tag}" >&2
            exit 1
          fi
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ steps.meta.outputs.tag }}

      # Checkout the release tag, then tell BigWigs this is a tag build.
      # Without overriding GITHUB_REF, packager exits early on branch pushes
      # with "Found future tag, not packaging" once HEAD is tagged.
      # GITHUB_OAUTH (not GITHUB_TOKEN) is what packager uses for GH releases.
      - name: Package and upload to CurseForge
        uses: BigWigsMods/packager@v2
        env:
          GITHUB_OAUTH: ${{ secrets.GITHUB_TOKEN }}
          CF_API_KEY: ${{ secrets.CF_API_KEY }}
          GITHUB_REF: refs/tags/${{ steps.meta.outputs.tag }}
          GITHUB_REF_NAME: ${{ steps.meta.outputs.tag }}
        with:
          args: -g retail
